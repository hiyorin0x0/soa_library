{% extends 'base.html' %}
{% block title %}Thêm nhân sự{% endblock %}
{% block page_title %}Khởi tạo tài khoản nhân sự{% endblock %}

{% block content %}
<div class="section-header">
    <div>
        <h2 class="section-title">Cấp tài khoản cán bộ mới</h2>
        <p class="section-subtitle">Thiết lập thông tin định danh và quyền truy cập nghiệp vụ</p>
    </div>
    <a href="{{ url_for('auth.users') }}" class="btn btn-outline-secondary btn-sm">
        <i class="fas fa-arrow-left"></i>Quay lại
    </a>
</div>

<div class="row justify-content-center">
    <div class="col-lg-6">
        <div class="card">
            <div class="card-header">Thông tin tài khoản</div>
            <form method="POST" data-no-pjax>
                <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
                <div class="card-body">
                    <div class="mb-3">
                        <label class="form-label">Họ và tên <span class="text-danger">*</span></label>
                        <input type="text" name="full_name" class="form-control" required>
                    </div>
                    <div class="row g-3 mb-3">
                        <div class="col-md-6">
                            <label class="form-label">Tên đăng nhập <span class="text-danger">*</span></label>
                            <input type="text" name="username" class="form-control" required>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label">Vai trò</label>
                            <select name="role" class="form-select">
                                <option value="librarian">Cán bộ lưu thông</option>
                                <option value="admin">Quản trị hệ thống</option>
                            </select>
                        </div>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Email công vụ <span class="text-danger">*</span></label>
                        <input type="email" name="email" class="form-control" required>
                    </div>
                    <div>
                        <label class="form-label">Mật khẩu khởi tạo <span class="text-danger">*</span></label>
                        <input type="password" name="password" class="form-control" required minlength="6">
                    </div>
                </div>
                <div class="card-footer d-flex gap-2">
                    <button type="submit" class="btn btn-primary">Tạo tài khoản</button>
                    <a href="{{ url_for('auth.users') }}" class="btn btn-outline-secondary">Hủy</a>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
